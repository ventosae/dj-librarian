name: Release

# Runs only when a v* tag is pushed, and the tag is the owner's (W-29): no branch, pull request,
# schedule or manual trigger. It runs the CI checks, checks that the tagged commit is on main and
# matches the version, builds the engine bundle and both plugin zips and creates a DRAFT GitHub
# release with the three files and the CHANGELOG.md section: dj-librarian-engine-<v>.mcpb (the
# standalone engine), dj-librarian-plugin-<v>.zip (skills with the engine inside) and
# dj-librarian-plugin-<v>-no-engine.zip (skills only). The owner reads the draft and makes it
# public by hand. No package index step: PyPI comes later, with the owner's yes (W-32, W-34,
# D-27, D-28, D-17, D-22).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  draft:
    name: draft release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Full history, so the tagged commit can be checked against main below. No step needs git
      # auth (gh reads GH_TOKEN), so the write token is not left in .git/config for uv sync.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checks job's secret scan (gitleaks-action) finds no commits in a tag push and scans
      # nothing. A commit on main had its scan when it reached main (ci.yml on the PR and the push),
      # so a tag on a commit that never reached main gets no draft.
      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Tag matches the version (pyproject.toml, plugin.json)
        run: |
          uv run python scripts/release_notes.py --check-tag "$TAG"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: uv run python scripts/release_notes.py "$VERSION" --out "$RUNNER_TEMP/notes.md"
      - name: Build the engine bundle
        run: uv run python scripts/build_mcpb.py
      - name: Build the plugin zip (engine inside)
        run: uv run python scripts/build_plugin_zip.py
      - name: Build the light plugin zip (no engine)
        run: uv run python scripts/build_plugin_zip.py --no-engine
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$TAG" --draft --verify-tag
          --title "dj-librarian $VERSION"
          --notes-file "$RUNNER_TEMP/notes.md"
          "dist/dj-librarian-engine-$VERSION.mcpb"
          "dist/dj-librarian-plugin-$VERSION.zip"
          "dist/dj-librarian-plugin-$VERSION-no-engine.zip"
