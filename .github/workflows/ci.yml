name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs these same checks on a v* tag before its draft release (W-32).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Palette check (docs/design.md, R-408)
        run: uv run python scripts/check_palette.py docs/design.md
      - name: Personal-data grep (R-1206, Q-26)
        run: uv run python scripts/check_personal.py

  plugin:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      # The engine bundle (the standalone fallback, not in the plugin): the official MCPB CLI checks
      # its manifest against the strict 0.4 schema the host installs it with (the pin is
      # scripts/build_mcpb.py's MCPB_CLI).
      - name: Check the engine manifest (MCPB schema)
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
      - name: Validate plugin
        run: claude plugin validate ./plugin --strict
      - name: Validate marketplace
        run: claude plugin validate .
      # Start the built bundle the way a host does: unpacked outside the checkout, its own
      # `uv run` command and env, initialize and tools/list, the tools compared with the manifest's.
      - uses: astral-sh/setup-uv@v6
      - name: Start the built engine
        run: python3 scripts/build_mcpb.py --out "$RUNNER_TEMP/engine" --smoke

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
