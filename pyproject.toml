[project]
name = "dj-librarian"
version = "0.1.2"
description = "Manage a rekordbox playlist tree from files. Create and add only."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2,<3",
    "mutagen>=1.47",
    "pillow>=11",
    "pyrekordbox>=0.4.4,<0.5",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.2",
]

[project.scripts]
dj = "dj.cli:app"
dj-mcp = "dj.mcp_server:main"

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dj"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff.lint]
# Baseline: pyflakes, syntax/statement errors, import order. Broader rule sets are a later PR.
select = ["E4", "E7", "E9", "F", "I"]
# E741 (names like `l`) and E731 (lambda assignment) are style-only and kept as written.
ignore = ["E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"pull_spotify.py" = ["E702"]  # stashed stdlib-only bootstrap, kept verbatim
